name: 24/7 Cloud Price Monitor & Mobile Notification

on:
  schedule:
    # Runs every 1 hour 24/7 in the cloud (no laptop needed)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  monitor-prices:
    name: Check Prices & Send Telegram Mobile Alerts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ReviewPulse Price Monitor
        env:
          API_URL: https://irpversion2-2.onrender.com
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '9149329197:AAEMiSz8nhY0Oc-BCPVgo5xJfN2kMHPTFSw' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7154556693' }}
          AUTH_TOKEN: dev-token
        run: |
          python automations/n8n/price_monitor_service.py --once
