[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewpulse-backend"
version = "0.1.0"
description = "ReviewPulse API backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "aiosqlite==0.22.1",
    "greenlet==3.5.6",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
    "ruff==0.17.1",
    "aiosqlite==0.22.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
anyio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
